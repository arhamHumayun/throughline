[package]
name = "diffview-core"
version = "0.1.0"
edition = "2021"
license = "MIT"
description = "Pure-data diff analysis: git diff, tree-sitter symbol graph, entrypoints, flow groups. Strip-mined from diff-core (MIT)."

[lib]
name = "diffview_core"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
petgraph = "0.6"
git2 = { version = "0.20", default-features = false }
thiserror = "2"
tree-sitter = "0.26.7"
tree-sitter-typescript = "0.23.2"
tree-sitter-python = "0.25.0"
toml = "0.8"
glob = "0.3"
sha2 = "0.10"
hex = "0.4"
aho-corasick = "1"
rayon = "1.10"
dashmap = "6"
bincode = "1"
once_cell = "1"
log = "0.4"
tracing = "0.1"
tempfile = "3"

[dev-dependencies]
proptest = "1"
insta = { version = "1", features = ["json", "redactions"] }
